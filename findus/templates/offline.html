{% load i18n %}
<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% trans "Sei offline" %} - FidaMano</title>
    <style>
        body {
            font-family: system-ui, -apple-system, sans-serif;
            text-align: center;
            padding: 50px 20px;
            background: #077f46;
            color: white;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }
        .offline-icon {
            font-size: 64px;
            margin-bottom: 20px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 15px;
        }
        p {
            font-size: 18px;
            margin-bottom: 30px;
            max-width: 500px;
        }
        button {
            background: white;
            color: #077f46;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div class="offline-icon">📶</div>
    <h1>{% trans "Sei offline" %}</h1>
    <p>{% trans "Controlla la tua connessione internet e riprova." %}</p>
    <button onclick="window.location.reload()">{% trans "Riprova" %}</button>
    
    <script>
        // Try to reload when connection is back
        window.addEventListener('online', () => {
            window.location.reload();
        });
    </script>
</body>
</html>
