<form class="service-form-step" data-step="3">
    {% csrf_token %}
    
    <!-- Step indicator -->
    <div class="step-info">
        <small>Step 3 of 3</small>
        <h4>Location & Availability</h4>
        <p>Service: {{ step1_data.title }}</p>
    </div>

    <!-- Availability -->
    <div class="form-field">
        <label for="id_availability" class="form-label required">Response Time</label>
        <select id="id_availability" name="availability" class="form-control" required>
            <option value="">Select response time</option>
            {% for value, label in availability_choices %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Region -->
    <div class="form-field">
        <label for="id_region" class="form-label required">Service Region</label>
        <select id="id_region" name="region" class="form-control" required>
            <option value="">Select region</option>
            {% for value, label in regions %}
                <option value="{{ value }}">{{ label }}</option>
            {% endfor %}
        </select>
    </div>

    <!-- Travel Fee -->
    <div class="form-field">
        <label for="id_travel_fee" class="form-label">Travel Fee (Optional)</label>
        <div class="modal-currency-input">
            <span class="modal-currency-symbol">₦</span>
            <input type="number" id="id_travel_fee" name="travel_fee" 
                   class="modal-currency-field" placeholder="0.00" min="0" step="100">
            <span class="modal-currency-label">NGN</span>
        </div>
    </div>

    <!-- Materials Included -->
    <div class="form-field">
        <label class="checkbox-card-simple">
            <input type="checkbox" name="materials_included" value="true" class="checkbox-input">
            <span class="checkbox-custom"></span>
            <span class="checkbox-text">Materials included in base price</span>
        </label>
    </div>
    
    <!-- Navigation Buttons -->
    <div class="form-actions">
        <button type="button" class="btn-prev-step"
                hx-post="{% url 'create_service_step2' %}"
                hx-target="#service-modal-content"
                hx-swap="innerHTML">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
            Back
        </button>
        
        <button type="button" class="btn-submit-final"
                hx-post="{% url 'create_service_finalize' %}"
                hx-target="#service-modal-content"
                hx-swap="innerHTML"
                hx-include="[name='availability'], [name='region'], [name='travel_fee'], [name='materials_included']">
            Create Service
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <polyline points="20 6 9 17 4 12"></polyline>
            </svg>
        </button>
    </div>
</form>
