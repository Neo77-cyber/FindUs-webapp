<form class="service-form-step active" data-step="1">
    {% csrf_token %}
    
    <!-- Service Title -->
    <div class="form-field">
        <label for="id_title" class="form-label required">Service Title</label>
        <input type="text" id="id_title" name="title" class="form-control" 
               placeholder="e.g., Emergency Plumbing Repair" required maxlength="200"
               value="{{ form.title.value|default:'' }}">
    </div>

    <!-- Category -->
    <div class="form-field">
        <label for="id_category" class="form-label required">Category</label>
        <select id="id_category" name="category" class="form-control" required>
            <option value="">Choose a category</option>
            {% for value, label in categories %}
                <option value="{{ value }}" {% if form.category.value == value %}selected{% endif %}>
                    {{ label }}
                </option>
            {% endfor %}
        </select>
    </div>

    <!-- Pricing Section -->
    <div class="modal-section-divider"></div>
    
    <div class="form-field">
        <label class="form-label required">Pricing</label>
        <div class="modal-pricing-grid">
            <div class="modal-pricing-type">
                <label class="modal-radio-card">
                    <input type="radio" name="price_type" value="hourly" checked>
                    <span class="modal-radio-card-content">
                        <span class="modal-radio-indicator"></span>
                        <span class="modal-radio-label">Hourly</span>
                    </span>
                </label>
                <label class="modal-radio-card">
                    <input type="radio" name="price_type" value="fixed">
                    <span class="modal-radio-card-content">
                        <span class="modal-radio-indicator"></span>
                        <span class="modal-radio-label">Fixed</span>
                    </span>
                </label>
            </div>
            <div class="modal-currency-input" id="hourly-rate-input">
                <span class="modal-currency-symbol">₦</span>
                <input type="number" name="hourly_rate" class="modal-currency-field" 
                       placeholder="0.00" min="0" step="100" required>
                <span class="modal-currency-label">per hour</span>
            </div>
            <div class="modal-currency-input" id="fixed-price-input" style="display: none;">
                <span class="modal-currency-symbol">₦</span>
                <input type="number" name="fixed_price" class="modal-currency-field" 
                       placeholder="0.00" min="0" step="100">
                <span class="modal-currency-label">fixed price</span>
            </div>
        </div>
    </div>
    
    <!-- Next Step Button -->
    <div class="form-actions">
        <button type="button" class="btn-next-step" 
                hx-post="{% url 'create_service_step2' %}"
                hx-target="#service-modal-content"
                hx-swap="innerHTML">
            Next: Media & Details
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
                <polyline points="9 18 15 12 9 6"></polyline>
            </svg>
        </button>
    </div>
</form>

<script>
// Show/hide price inputs based on selection
document.querySelectorAll('input[name="price_type"]').forEach(radio => {
    radio.addEventListener('change', function() {
        if (this.value === 'hourly') {
            document.getElementById('hourly-rate-input').style.display = 'flex';
            document.getElementById('fixed-price-input').style.display = 'none';
            document.querySelector('#hourly-rate-input input').required = true;
            document.querySelector('#fixed-price-input input').required = false;
        } else {
            document.getElementById('hourly-rate-input').style.display = 'none';
            document.getElementById('fixed-price-input').style.display = 'flex';
            document.querySelector('#hourly-rate-input input').required = false;
            document.querySelector('#fixed-price-input input').required = true;
        }
    });
});
</script>
