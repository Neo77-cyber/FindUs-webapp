<!-- templates/partials/save_button.html -->
{% if request.user.is_authenticated %}
<button 
class="save-service-btn btn-outline btn-full {% if is_saved %}saved-active{% endif %}"
hx-get="{% url 'save_service' service.id %}"
hx-target="this"
hx-swap="outerHTML"
{% if is_saved %}data-saved="true"{% endif %}
>
{% if is_saved %}
<!-- SAVED - RED HEART -->
<svg width="18" height="18" viewBox="0 0 24 24" style="fill: red; stroke: red;">
   <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
</svg>
Remove from Saved
{% else %}
<!-- NOT SAVED - OUTLINE HEART -->
<svg width="18" height="18" viewBox="0 0 24 24" style="fill: none; stroke: currentColor;">
   <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
</svg>
Save Service
{% endif %}
</button>
{% else %}
<button 
   class="btn-outline btn-full"
   onclick="window.location.href='{% url 'signin' %}?next={{ request.path }}'"
   >
   <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor">
      <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
   </svg>
   Login to Save
</button>
{% endif %}
