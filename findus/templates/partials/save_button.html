{% if request.user.is_authenticated %}
    <button 
        class="btn-outline btn-full"
        hx-get="{% url 'save_service' service.id %}"
        hx-target="this"
        hx-swap="outerHTML"
    >
        {% if is_saved %}
            <!-- Already saved - filled heart -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="red" stroke="red" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            Remove from Saved
        {% else %}
            <!-- Not saved - outline heart -->
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
            </svg>
            Save Service
        {% endif %}
    </button>
{% else %}
    <button 
        class="btn-outline btn-full"
        hx-get="{% url 'register' %}"
        hx-target="body"
        hx-push-url="true"
        hx-swap="innerHTML"
    >
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        Save Service
    </button>
{% endif %}
